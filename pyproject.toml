[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reygrid"
version = "1.0.2"
description = "Powerful, typed Python client for the ReyGrid API with full base URL control, SSE streaming, tool calls, and pagination."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

authors = [
  { name = "ReyGrid", email = "support@reygrid.com" },
]

dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
sse = ["httpx-sse>=0.4.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx-sse>=0.4.0",
]

[project.urls]
Homepage = "https://reygrid.com"
Source = "https://github.com/reygrid/reygrid-python"

[tool.setuptools.packages.find]
where = ["src"]
include = ["reygrid*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
